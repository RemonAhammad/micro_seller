name: micro_seller
description: Inventory and order manager for micro sellers
publish_to: 'none'
version: 1.0.4+8

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.2

  # Database
  # Migrated from abandoned `isar` 3.1.0+1 to community fork.
  # 3.2.0+ ships 16 KB page-aligned native binaries (required for Play Store
  # on Android 15+).
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.4

  # Code generation helpers
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Google auth & Drive
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0

  # Navigation
  go_router: ^14.2.7

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.1

  # Image & scanning
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  mobile_scanner: ^6.0.0

  # UI & charts
  fl_chart: ^0.69.0

  # HTTP
  http: ^1.2.0

  # Persistence
  shared_preferences: ^2.3.2

  # CSV & file
  csv: ^6.0.0
  file_picker: ^8.1.2

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Localization
  flutter_localizations:
    sdk: flutter

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  open_file: ^3.5.10
  # Renders a Flutter widget tree off-screen to a PNG. Used by pdf_service to
  # capture the invoice via Skia (full Unicode shaping for Bengali / Arabic /
  # CJK) before embedding into the PDF — bypasses the unreliable
  # Printing.convertHtml WebView path.
  screenshot: ^3.0.0

  # Showcase & Updates
  showcaseview: ^5.0.1
  in_app_update: ^4.2.5
  package_info_plus: ^9.0.1

  # Env
  flutter_dotenv: ^5.2.1

  # Security gate for destructive actions (Clear All Data, etc.). Falls back
  # to a 4-digit PIN stored as a SHA-256 hash when biometrics aren't set up.
  local_auth: ^2.3.0
  crypto: ^3.0.3

  # Background periodic Drive backup (Android WorkManager wrapper). Schedules
  # a daily worker when "Auto Backup" is on; the worker survives app close
  # and reboot. Failed silent sign-in (revoked access) raises a notification
  # and a Settings banner — never silent.
  workmanager: ^0.10.10
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  isar_community_generator: ^3.3.2
  json_serializable: ^6.7.1

  # Launcher icon generation
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
