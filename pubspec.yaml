name: micro_seller
description: Inventory and order manager for micro sellers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # Code generation helpers
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Google auth & Drive
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0

  # Navigation
  go_router: ^14.2.7

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.1

  # Image & scanning
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  mobile_scanner: ^6.0.0

  # UI & charts
  fl_chart: ^0.69.0

  # HTTP
  http: ^1.2.0

  # Persistence
  shared_preferences: ^2.3.2

  # CSV & file
  csv: ^6.0.0
  file_picker: ^8.1.2

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Localization
  flutter_localizations:
    sdk: flutter

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.3.9
  freezed: ">=2.4.6 <2.5.3"
  isar_generator: ^3.1.0+1
  json_serializable: ^6.7.1

  # Launcher icon generation
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
