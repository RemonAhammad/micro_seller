name: micro_seller
description: Inventory and order manager for micro sellers
publish_to: 'none'
version: 1.0.11+19

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  # Moves in lockstep with riverpod_generator (see dev_dependencies).
  riverpod_annotation: 4.0.2

  # Database
  # Migrated from abandoned `isar` 3.1.0+1 to community fork.
  # 3.2.0+ ships 16 KB page-aligned native binaries (required for Play Store
  # on Android 15+).
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.6

  # Code generation helpers
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Google auth & Drive
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.5

  # Navigation
  go_router: ^18.1.1

  # PDF
  pdf: ^3.13.1
  printing: ^5.15.1

  # Image & scanning
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  mobile_scanner: ^7.4.2

  # UI & charts
  fl_chart: ^1.3.0
  # Phone colors (Material You): the Android 12+ system color scheme.
  # Pinned: 1.9.0 doesn't build on AGP 8 (its Gradle script never applies the
  # Kotlin plugin; fixed in 2.0.2), and 2.x is built on package:material_ui,
  # whose ColorScheme is not package:flutter/material.dart's.
  dynamic_color: 1.8.1

  # HTTP
  http: ^1.6.0

  # Persistence
  shared_preferences: ^2.5.6
  # Pinned below 2.5.0: 2.5.0 switched to JNI and crashes release (R8) builds
  # at startup with NoSuchMethodError ...ApiRegistrar.getAll — R8 renames the
  # kotlin.* classes its bindings look up by name (flutter/flutter#194649).
  # Lift once a fixed release ships (flutter/packages#13311).
  shared_preferences_android: '>=2.4.28 <2.5.0'

  # CSV & file
  csv: ^8.0.0
  file_picker: ^13.2.0

  # Notifications
  flutter_local_notifications: ^22.3.3

  # Localization
  flutter_localizations:
    sdk: flutter

  # Utilities
  intl: ^0.20.2 # pinned to 0.20.2 by flutter_localizations (Flutter 3.44.9)
  uuid: ^4.6.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  open_file: ^4.0.0
  # Renders a Flutter widget tree off-screen to a PNG. Used by pdf_service to
  # capture the invoice via Skia (full Unicode shaping for Bengali / Arabic /
  # CJK) before embedding into the PDF — bypasses the unreliable
  # Printing.convertHtml WebView path.
  screenshot: ^3.0.0

  # Showcase & Updates
  showcaseview: ^5.1.0
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.2

  # Env
  flutter_dotenv: ^6.0.1

  # Security gate for destructive actions (Clear All Data, etc.). Falls back
  # to a 4-digit PIN stored as a SHA-256 hash when biometrics aren't set up.
  local_auth: ^3.0.2
  crypto: ^3.0.7

  # Background periodic Drive backup (Android WorkManager wrapper). Schedules
  # a daily worker when "Auto Backup" is on; the worker survives app close
  # and reboot. Failed silent sign-in (revoked access) raises a notification
  # and a Settings banner — never silent.
  workmanager: ^0.10.10
  tabler_icons_next: ^3.48.0
  # Direct only to size the SVG picture cache (tabler_icons_next renders via it).
  flutter_svg: ^2.3.0
  in_app_review: ^2.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  # build_runner 2.17+ needs build 5; riverpod_generator needs build <5.
  build_runner: ^2.15.1
  # Code generators are pinned as one set: newer riverpod_generator /
  # json_serializable need analyzer 12+, which only freezed 4 (Dart 3.13,
  # newer than Flutter 3.44.9) or a freezed 3.2.6 pre-release supports.
  riverpod_generator: 4.0.3
  # freezed 4 needs Dart 3.13; Flutter 3.44.9 (on one of the Macs that make
  # releases) ships Dart 3.12.
  freezed: 3.2.5
  isar_community_generator: ^3.4.1
  json_serializable: ^6.13.0

  # Launcher icon generation
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
  # Roboto for iOS (lib/core/theme/app_fonts.dart): iPhones ship San
  # Francisco, so the app bundles Android's font to draw the same there.
  # Static files from the Flutter SDK (Apache-2.0, see Roboto_LICENSE.txt),
  # nothing lighter than 400 (the app uses none). Named RobotoStatic, not
  # Roboto: a bundled family wins over the system's, and Android's variable
  # system Roboto would lose its real 600 and 800 weights.
  fonts:
    - family: RobotoStatic
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
