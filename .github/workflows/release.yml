name: Release

on:
  # A version tag (v1.0.5, v1.0.5-rc.1) builds the signed APKs and the
  # unsigned iPhone app, and drafts a GitHub Release for review. Push one tag
  # at a time: GitHub sends no events when more than three tags are pushed at
  # once.
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  # "Run workflow" on main: the same signed build, artifacts only, no release.
  workflow_dispatch:

permissions: {}

# Restore main's caches, but never save tag-scoped entries no later run can use.
cache-mode: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      # The ios job below builds the real app, so the Android build doesn't
      # also wait for ci.yml's iOS check on a macOS runner.
      skip-ios: true

  android:
    name: Signed APKs + AAB
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Holds the signing secrets: required reviewer, and only main / v* tags.
    environment: release
    permissions:
      contents: read
    env:
      REQUIRE_RELEASE_SIGNING: 'true' # build.gradle.kts: no debug-key fallback
      BUILD_TOOLS: 36.0.0
    outputs:
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      signer: ${{ steps.key.outputs.signer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag check needs origin/main
          persist-credentials: false

      - name: NDK version from build.gradle.kts
        # One source of truth: the version Gradle builds with.
        run: |
          ndk=$(sed -nE 's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts)
          if [ -z "$ndk" ]; then
            echo "::error::No ndkVersion in android/app/build.gradle.kts"
            exit 1
          fi
          echo "NDK_VERSION=$ndk" >> "$GITHUB_ENV"

      - name: Version matches the tag
        id: version
        run: |
          v=$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml)
          name=${v%%+*}
          code=${v##*+}
          if [[ $v != *+* || ! $code =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml version '$v' must be name+code, e.g. 1.0.5+10"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$name" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec.yaml (v$name)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::The tagged commit isn't on main."
              exit 1
            fi
          fi
          prerelease=false
          [[ $name == *-* ]] && prerelease=true
          {
            echo "name=$name"
            echo "code=$code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'

      - name: Android NDK ${{ env.NDK_VERSION }}
        # Not preinstalled on the image; Flutter needs it to embed native
        # debug symbols in the AAB. Prune the image's other NDKs if space is low.
        run: |
          avail_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$avail_kb" -lt $((15 * 1024 * 1024)) ]; then
            find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name "$NDK_VERSION" -exec sudo rm -rf {} +
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > "$RUNNER_TEMP/sdkmanager.log" \
            || { cat "$RUNNER_TEMP/sdkmanager.log"; exit 1; }
          df -h /

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The fingerprint isn't confidential: accept it as a variable or a secret.
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || secrets.ANDROID_SIGNING_CERT_SHA256 }}
          # Names of values saved as variables by mistake (only names reach the shell).
          SAVED_AS_VARIABLE: >-
            ${{ vars.ANDROID_KEYSTORE_BASE64 && 'ANDROID_KEYSTORE_BASE64 ' || '' }}${{ vars.ANDROID_KEYSTORE_PASSWORD && 'ANDROID_KEYSTORE_PASSWORD ' || '' }}${{ vars.ANDROID_KEY_ALIAS && 'ANDROID_KEY_ALIAS ' || '' }}${{ vars.ANDROID_KEY_PASSWORD && 'ANDROID_KEY_PASSWORD ' || '' }}${{ vars.DOTENV && 'DOTENV' || '' }}
        run: |
          if [ -n "${SAVED_AS_VARIABLE// /}" ]; then
            echo "::error::These were saved as environment VARIABLES, so anyone with access can read them: $SAVED_AS_VARIABLE. Delete them under 'Environment variables' and add them under 'Environment secrets'."
          fi
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing+=" ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing+=" ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing+=" ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing+=" ANDROID_KEY_PASSWORD"
          [ -n "$EXPECTED_SHA256" ] || missing+=" ANDROID_SIGNING_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Not found in the 'release' environment:$missing. On the Mac with the keystore run 'bash tool/ci/copy_release_secrets.sh' and paste each value in Settings → Environments → release (names must match exactly)."
            exit 1
          fi
          [ -z "${SAVED_AS_VARIABLE// /}" ] || exit 1
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # The keystore must hold the expected certificate under this alias.
          actual=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" \
            | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*(.*)$/\1/p' | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          want=$(printf '%s' "$EXPECTED_SHA256" | tr -d ': \n' | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$want" ]; then
            echo "::error::Alias '$KEY_ALIAS' holds certificate ${actual:-<none>}, expected $want."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signer=$want" >> "$GITHUB_OUTPUT"

      - name: .env
        # A Flutter asset (plain text inside the APK, so not confidential),
        # but the release one must carry the real OAuth client ids.
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          [ -n "$DOTENV" ] || { echo "::error::DOTENV not found in the 'release' environment's secrets (paste the whole .env as a secret named DOTENV)."; exit 1; }
          printf '%s\n' "$DOTENV" > .env
          # Read the line the way flutter_dotenv does: optional "export",
          # spaces around "=", quotes, trailing comment.
          web_id=$(sed -nE 's/^[[:space:]]*(export[[:space:]]+)?GOOGLE_OAUTH_WEB_CLIENT_ID[[:space:]]*=(.*)$/\2/p' .env \
            | tail -n 1 | sed -E 's/(^|[[:space:]])#.*$//' | tr -d " \t\r\"'")
          if [ -z "$web_id" ]; then
            # Key names only — never values.
            keys=$(sed -nE 's/^[[:space:]]*(export[[:space:]]+)?([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=.*/\2/p' .env | tr '\n' ' ')
            if [ -z "$keys" ]; then
              echo "::error::DOTENV doesn't look like a .env file (no KEY=value lines). In the project folder run 'pbcopy < .env' and paste it into the DOTENV secret again."
            else
              echo "::error::DOTENV has no value for GOOGLE_OAUTH_WEB_CLIENT_ID (Drive backup sign-in needs it). Keys found in DOTENV: $keys"
            fi
            exit 1
          fi

      - name: Build
        env:
          NAME: ${{ steps.version.outputs.name }}
        # Each build keeps its own obfuscation symbols and R8 mapping, so every
        # artifact can be decoded with exactly the files that built it.
        run: |
          mkdir -p dist/apks dist/bundle dist/symbols
          build() { # kind, flutter build args...
            local kind=$1; shift
            flutter build "$@" --release --obfuscate --tree-shake-icons \
              --split-debug-info="build/debug-info-$kind"
            mkdir -p "dist/symbols/$kind"
            cp -R "build/debug-info-$kind/." "dist/symbols/$kind/"
            cp build/app/outputs/mapping/release/mapping.txt "dist/symbols/$kind/"
          }

          build bundle appbundle
          cp build/app/outputs/bundle/release/*.aab "dist/bundle/micro-seller-v$NAME.aab"

          build universal apk
          cp build/app/outputs/flutter-apk/app-release.apk "dist/apks/micro-seller-v$NAME-universal.apk"

          build split apk --split-per-abi
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/apks/micro-seller-v$NAME-$abi.apk"
          done

          # flutter build may re-resolve; the shipped build must match the lock.
          git diff --exit-code -- pubspec.lock

      - name: Verify
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          tool/ci/verify_android_artifacts.sh "$EXPECTED_SHA256" "$NAME" "$CODE" dist/apks/*.apk dist/bundle/*.aab
          (cd dist/apks && sha256sum -- *.apk > SHA256SUMS.txt)
          {
            echo "### Micro Seller v$NAME ($CODE) @ ${GITHUB_SHA:0:7}"
            echo '```'
            cat dist/apks/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: dist/apks/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: dist/bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 3 }}
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Needed to decode obfuscated crash stack traces of this version.
          # Artifacts expire (90 days at most): archive it with the AAB.
          name: symbols
          path: dist/symbols/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 3 }}

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties .env

  ios:
    name: Unsigned iPhone app (.ipa)
    # Runs beside the android job. publish waits for it to finish, not to
    # succeed: the .ipa joins the draft only when this job passed. Users
    # sideload it with AltStore, SideStore or Sideloadly, which sign it with
    # their own Apple ID: no Apple account or signing secret here.
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    # Only for DOTENV: the same approval and branch rules as the android job.
    environment: release
    permissions:
      contents: read
    env:
      # Never change it: a sideloaded copy updates in place, keeping its data,
      # only under the same bundle ID, and the iOS OAuth client in Info.plist
      # (Google Drive backup) is registered for it.
      IOS_BUNDLE_ID: com.blackshadowsoftware.microseller
    outputs:
      ipa: ${{ steps.package.outputs.ipa }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag check needs origin/main
          persist-credentials: false

      - name: Version matches the tag
        id: version
        # The android job's check. Apple's version is three numbers, and
        # Flutter would turn 1.0.5-rc.1 into 1.0.5.1, so an rc is built as
        # 1.0.5; its build number still sets it apart from the final release.
        run: |
          v=$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml)
          name=${v%%+*}
          code=${v##*+}
          if [[ $v != *+* || ! $code =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml version '$v' must be name+code, e.g. 1.0.5+10"
            exit 1
          fi
          build_name=${name%%-*}
          if [[ ! $build_name =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pubspec.yaml version name '$name' must start with three numbers, e.g. 1.0.5 or 1.0.5-rc.1"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$name" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec.yaml (v$name)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::The tagged commit isn't on main."
              exit 1
            fi
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "build_name=$build_name"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-flutter

      - name: .env
        # The android job's step: a Flutter asset (plain text inside the app,
        # so not confidential), but the release one must carry the real ids.
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          [ -n "$DOTENV" ] || { echo "::error::DOTENV not found in the 'release' environment's secrets (paste the whole .env as a secret named DOTENV)."; exit 1; }
          printf '%s\n' "$DOTENV" > .env
          # Read the line the way flutter_dotenv does: optional "export",
          # spaces around "=", quotes, trailing comment.
          web_id=$(sed -nE 's/^[[:space:]]*(export[[:space:]]+)?GOOGLE_OAUTH_WEB_CLIENT_ID[[:space:]]*=(.*)$/\2/p' .env \
            | tail -n 1 | sed -E 's/(^|[[:space:]])#.*$//' | tr -d " \t\r\"'")
          if [ -z "$web_id" ]; then
            # Key names only — never values.
            keys=$(sed -nE 's/^[[:space:]]*(export[[:space:]]+)?([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=.*/\2/p' .env | tr '\n' ' ')
            if [ -z "$keys" ]; then
              echo "::error::DOTENV doesn't look like a .env file (no KEY=value lines). In the project folder run 'pbcopy < .env' and paste it into the DOTENV secret again."
            else
              echo "::error::DOTENV has no value for GOOGLE_OAUTH_WEB_CLIENT_ID (Drive backup sign-in needs it). Keys found in DOTENV: $keys"
            fi
            exit 1
          fi

      - name: Build
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign --obfuscate --tree-shake-icons \
            --split-debug-info=build/debug-info-ios \
            --build-name "$BUILD_NAME" --build-number "$CODE"
          # flutter build may re-resolve; the shipped build must match the lock.
          git diff --exit-code -- pubspec.lock
          # Flutter migrates an outdated Xcode project during the build (see
          # ci.yml's ios job): it still builds, but from files the repo lacks.
          drift=$(git status --porcelain -- ios)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::warning::The iOS build changed files under ios/ (listed in the log). Run 'flutter build ios --no-codesign' on your Mac and commit what it changes under ios/."
          fi

      - name: Package and verify
        id: package
        env:
          NAME: ${{ steps.version.outputs.name }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          CODE: ${{ steps.version.outputs.code }}
        # An .ipa is a zip of Payload/<name>.app. The crash-report symbols get
        # their own artifact, as on Android.
        run: |
          ipa="micro-seller-v$NAME-unsigned.ipa"
          stage="$RUNNER_TEMP/ipa"
          rm -rf "$stage" dist/ipa dist/ios-symbols
          mkdir -p "$stage/Payload" dist/ipa dist/ios-symbols
          ditto build/ios/iphoneos/Runner.app "$stage/Payload/Runner.app"
          (cd "$stage" && zip -qry -X "$GITHUB_WORKSPACE/dist/ipa/$ipa" Payload)
          bash tool/ci/verify_ios_artifacts.sh "$IOS_BUNDLE_ID" "$BUILD_NAME" "$CODE" "dist/ipa/$ipa"
          sha=$(shasum -a 256 "dist/ipa/$ipa" | awk '{print $1}')

          # Dart symbols (the code is obfuscated) and the native dSYMs.
          cp -R build/debug-info-ios/. dist/ios-symbols/
          while IFS= read -r dsym; do
            ditto "$dsym" "dist/ios-symbols/${dsym##*/}"
          done < <(find build/ios/Release-iphoneos -maxdepth 2 -type d -name '*.dSYM' -prune)

          {
            echo "ipa=$ipa"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Micro Seller v$NAME ($CODE) @ ${GITHUB_SHA:0:7}, iPhone"
            echo '```'
            echo "$sha  $ipa"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: dist/ipa/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Needed to read crash reports of this version. Artifacts expire
          # (90 days at most): archive it with the Android symbols.
          name: ios-symbols
          path: dist/ios-symbols/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 3 }}

      - name: Remove .env
        if: always()
        run: rm -f .env

  publish:
    name: Draft GitHub Release
    needs: [checks, android, ios]
    # Waits for the iOS build but needs only the Android one: the APKs are
    # drafted whatever happens to the .ipa (unless the run is cancelled).
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: dist

      - name: Download the iPhone app
        id: ipa
        if: needs.ios.result == 'success' && needs.ios.outputs.ipa != ''
        # Outside dist/ until its checksum is checked, and never fatal here:
        # the next step drafts the Android files first.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: ipa

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.android.outputs.name }}
          PRERELEASE: ${{ needs.android.outputs.prerelease }}
          SIGNER: ${{ needs.android.outputs.signer }}
          IOS_RESULT: ${{ needs.ios.result }}
          IPA: ${{ steps.ipa.outcome == 'success' && needs.ios.outputs.ipa || '' }}
          IPA_SHA256: ${{ needs.ios.outputs.sha256 }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          # The .ipa joins the draft only as exactly what the ios job built and
          # checked. The Android files are drafted either way.
          ipa_name="micro-seller-v$NAME-unsigned.ipa"
          no_ipa=""
          if [ -z "$IPA" ]; then
            if [ "$IOS_RESULT" = success ]; then
              no_ipa="the .ipa couldn't be downloaded from the iOS job"
            else
              no_ipa="the iOS build ended in '$IOS_RESULT'"
            fi
          elif [ "$IPA" != "$ipa_name" ]; then
            no_ipa="the iOS build made $IPA, expected $ipa_name"
          elif ! (cd ../ipa && printf '%s  %s\n' "$IPA_SHA256" "$IPA" | sha256sum -c --strict --quiet -); then
            no_ipa="$IPA doesn't match the checksum its build reported"
          else
            mv "../ipa/$IPA" .
            printf '%s  %s\n' "$IPA_SHA256" "$IPA" >> SHA256SUMS.txt
          fi
          [ -z "$no_ipa" ] || IPA=""
          notes=$(cat <<EOF
          **Which file?**
          - \`micro-seller-v$NAME-universal.apk\` works on every Android phone.
          - \`micro-seller-v$NAME-arm64-v8a.apk\` is smaller and fits most phones. \`armeabi-v7a\` is for older 32-bit phones, \`x86_64\` for emulators and Chromebooks.
          - Keep using the same file type for future updates: Android won't switch from a per-CPU APK to the universal one.

          **Installing**
          - These APKs are signed by the developer (certificate SHA-256 \`$SIGNER\`), not by Google Play, so they can't update a Play Store install, or the other way round. To switch, back up first (Settings → backup), uninstall, then install.
          - Check a download with \`sha256sum -c SHA256SUMS.txt\`.
          EOF
          )
          # Also what a re-run adds to, or removes from, an existing draft.
          ios_notes=$(printf '%s\n' \
            '**iPhone**' \
            "- \`$ipa_name\` is unsigned, so it has to be sideloaded: AltStore, SideStore or Sideloadly signs it with your own Apple ID and installs it (iOS 16 or later). With a free Apple ID, the app must be signed again every 7 days (AltStore and SideStore can do it automatically), and at most 3 sideloaded apps can be installed. Steps: https://github.com/$GH_REPO#iphone-sideload" \
            "- Google Drive backup works on iPhone (Settings → Google Drive Backup); the automatic daily backup is Android-only. If your sideloading tool changed the app's ID, Google sign-in can fail: then back up with Settings → Local Backup. Back up to a file before you delete the app.")
          [ -z "$IPA" ] || notes+=$'\n\n'"$ios_notes"
          # A draft can be refreshed by re-running; a published release is final.
          state=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == env.TAG)] | if length == 0 then "none" else (.[0].draft | tostring) end')
          case $state in
            true)
              gh release upload "$TAG" ./* --clobber
              ;;
            false)
              echo "::error::$TAG is already published. Bump the version and push a new tag."
              exit 1
              ;;
            *)
              args=(--draft --verify-tag --generate-notes --title "Micro Seller $TAG" --notes "$notes")
              [ "$PRERELEASE" = true ] && args+=(--prerelease)
              gh release create "$TAG" ./* "${args[@]}"
              ;;
          esac

          attached() {
            gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq '[.[] | select(.tag_name == env.TAG)][0].assets // [] | .[] | select(.state == "uploaded" and .size > 0) | .name'
          }
          # In a draft that already existed, the iPhone app and its notes follow
          # this run: added when it attached the .ipa, removed when it didn't.
          # An .ipa from an earlier attempt (or another commit, if the tag
          # moved) isn't one this run checked, and SHA256SUMS.txt no longer
          # lists it.
          if [ "$state" = true ]; then
            attached | { grep -E '\.ipa$' || true; } | while IFS= read -r asset; do
              [ "$asset" = "$IPA" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            body=$(gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq '[.[] | select(.tag_name == env.TAG)][0].body // ""' | tr -d '\r')
            if [ -n "$IPA" ]; then
              [[ $body == *"$IPA"* ]] || gh release edit "$TAG" --notes "$body"$'\n\n'"$ios_notes"
            elif [[ $body == *"$ipa_name"* ]]; then
              stripped=${body//$'\n\n'"$ios_notes"/}
              if [ "$stripped" != "$body" ]; then
                gh release edit "$TAG" --notes "$stripped"
              else
                echo "::warning::The draft's notes still mention $ipa_name, which it no longer has: edit them before publishing."
              fi
            fi
          fi

          # Every file must be attached to the draft before anyone publishes it
          # (v1.0.5 ended up published with no APKs and nothing noticed).
          missing() { comm -23 <(printf '%s\n' ./* | sed 's|^\./||' | sort) <(attached | sort); }
          if [ -n "$(missing)" ]; then
            echo "::warning::Not attached yet: $(missing | tr '\n' ' ')- uploading again."
            gh release upload "$TAG" ./* --clobber
          fi
          if [ -n "$(missing)" ]; then
            echo "::error::Still missing from release $TAG: $(missing | tr '\n' ' ')"
            exit 1
          fi
          ipa_fix="The Android files are complete. To add the .ipa, re-run the iOS job on the run page: this job then runs again and attaches it."
          {
            echo "### Draft release $TAG is ready, with $(attached | wc -l | tr -d ' ') files:"
            attached | sed 's/^/- /'
            echo
            echo "On the Releases page, check that **Assets** lists these files, then click **Publish release**."
            if [ -n "$no_ipa" ]; then
              echo
              echo "**No iPhone app (.ipa) in this draft:** $no_ipa. $ipa_fix"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$no_ipa" ]; then
            if [ "$IOS_RESULT" != success ]; then
              # The ios job's own result already shows on the run.
              echo "::warning::No iPhone app (.ipa) in this draft: $no_ipa. $ipa_fix"
            else
              # The iOS build worked and only this step lost the .ipa: fail,
              # now that the draft is complete, so that it isn't missed.
              echo "::error::No iPhone app (.ipa) in this draft: $no_ipa. $ipa_fix"
              exit 1
            fi
          fi
