name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs these same checks before building a release.
  workflow_call:
    inputs:
      skip-ios:
        description: >-
          Skip the iOS build check. release.yml sets it: its own ios job
          builds the real .ipa, and the Android release must not wait for a
          macOS runner.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # In a call from release.yml, github.workflow is the caller's name, so a
  # release run never shares (or cancels) a group with push/PR CI.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  checks:
    name: Analyze & test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - name: Generated code is committed and current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          stale=$(git status --porcelain -- '*.g.dart' '*.freezed.dart' pubspec.lock)
          if [ -n "$stale" ]; then
            echo "$stale"
            git diff --stat -- '*.g.dart' '*.freezed.dart' pubspec.lock
            echo "::error::Generated files are out of date. Run 'dart run build_runner build --delete-conflicting-outputs' and commit the result."
            exit 1
          fi

      - name: Translations parity
        run: bash .claude/skills/l10n/scripts/l10n_parity.sh

      - name: Analyze
        # Errors and warnings fail; infos (style hints) don't.
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub --file-reporter "json:$RUNNER_TEMP/tests.jsonl"

      - name: No test was skipped
        # The real-Isar tests skip themselves when the Isar core library isn't
        # found; that must fail here rather than pass silently.
        run: |
          skipped=$(jq -rs '
            (map(select(.type == "testStart") | {key: (.test.id | tostring), value: .test.name}) | from_entries) as $names
            | map(select(.type == "testDone" and .skipped == true and .hidden != true) | $names[.testID | tostring])
            | .[]' "$RUNNER_TEMP/tests.jsonl")
          if [ -n "$skipped" ]; then
            echo "$skipped"
            echo "::error::$(printf '%s\n' "$skipped" | wc -l | tr -d ' ') test(s) skipped (Isar core library not loaded?)"
            exit 1
          fi
          echo "No skipped tests."

  ios:
    name: iOS build (no codesign)
    # Runs beside the checks, not after them. release.yml's call skips it
    # (see skip-ios above). On main it also saves the macOS Flutter and pub
    # caches (setup-flutter), which release runs can only restore.
    if: ${{ !inputs.skip-ios }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also writes the placeholder .env (a declared asset) from .env.example.
      - uses: ./.github/actions/setup-flutter

      - name: Build
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign
          # flutter build may re-resolve; the build must match the lock.
          git diff --exit-code -- pubspec.lock
          # Flutter migrates an outdated Xcode project (e.g. to Swift Package
          # Manager) during the build. It still builds, but the result belongs
          # in the repo so every build starts from the same project.
          drift=$(git status --porcelain -- ios)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::warning::The iOS build changed files under ios/ (listed in the log). Run 'flutter build ios --no-codesign' on your Mac and commit what it changes under ios/."
          fi
